apiVersion: v1
kind: Namespace
metadata:
  name: tf-upgrade-loadbalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upgrade-echo
  template:
    metadata:
      labels:
        app: upgrade-echo
    spec:
      containers:
      - name: echo
        image: hashicorp/http-echo:1.0.0
        args: ["-listen=:8080", "-text=kind-upgrade-ok"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
spec:
  selector:
    app: upgrade-echo
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: LoadBalancer
